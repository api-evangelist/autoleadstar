summary: >-
  Cross-cutting standards and compliance posture. Certification claims are searched from
  Fullpath's own Legal & Trust Center; protocol conformance is derived from the published
  OpenAPI.

certifications:
- id: iso-27001
  name: ISO/IEC 27001 — Information Security Management
  claimed: true
  evidence: >-
    "Fullpath is ISO 27001 and ISO 42001 certified, the top international standard of
    information security and AI governance." — https://www.fullpath.com/legal-and-trust/
    (Security section), corroborated at https://www.fullpath.com/cdp-for-enterprise/
  certificate_published: false
  note: >-
    The claim is asserted in prose. No certificate number, certifying body, scope statement,
    or audit date is published, and there is no downloadable report or Trust-Center portal
    (Vanta/Drata/SafeBase) behind an NDA gate. Fullpath does commit publicly to "regular
    surveillance audits and recertification audits".
- id: iso-42001
  name: ISO/IEC 42001 — AI Management Systems
  claimed: true
  evidence: https://www.fullpath.com/legal-and-trust/
  certificate_published: false
  note: >-
    Notable — ISO 42001 is still rare in the catalog, and for a company whose product is an
    AI agent acting on consumer data it is the more relevant of the two certifications.
- id: soc-2
  name: SOC 2
  claimed: false
  note: No SOC 2 Type I or Type II claim appears on any Fullpath page.

regulatory:
- id: ccpa
  conforms: true
  evidence: >-
    Privacy Policy names Fullpath a "Service Provider" and the dealership client a
    "Business" under the CCPA; states no sale or sharing of personal information in the
    preceding 12 months. https://www.fullpath.com/legal-and-trust/?nav=privacypolicy
- id: gdpr
  conforms: partial
  evidence: >-
    A Data Processing Addendum is published and sub-processors are listed with locations,
    data categories and Transfer Impact Assessments. All sub-processors are US-located.
- id: us-state-privacy
  conforms: true
  evidence: >-
    Privacy policy names VCDPA, CPA, CPDPA and UCPA explicitly and routes them through the DPA.
- id: ftc-safeguards
  conforms: claimed
  evidence: >-
    "ensures that you remain in compliance with FTC regulations" — Legal & Trust Center.
    Relevant because auto dealers are covered financial institutions under the FTC
    Safeguards Rule.
- id: tcpa
  conforms: relevant
  evidence: >-
    The entire Consent Management vendor API exists to record per-channel communication
    consent (email / phone_sms / phone_call) with a timestamp — the operational shape of a
    TCPA/CAN-SPAM consent ledger. No TCPA conformance statement is published, but the API
    is a compliance artifact in practice.

