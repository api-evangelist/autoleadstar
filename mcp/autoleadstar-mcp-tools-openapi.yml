          required: true
          schema:
            type: integer
          description: Dealership identifier
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number (1-based)
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: Number of items per page
      responses:
        '200':
          description: A paginated list of audiences
          content:
            application/json:
              example:
                data:
                  - id: 101
                    name: "High Value Customers"
                    description: "Customers with lifetime value > $10,000"
                    shopper_count: 245
                    created_at: "2024-01-01T00:00:00Z"
                  - id: 102
                    name: "Service Due"
                    description: "Customers due for service appointment"
                    shopper_count: 89
                    created_at: "2024-01-05T00:00:00Z"
                meta:
                  current_page: 1
                  per_page: 10
                  total: 15
                  total_pages: 2
        '401':
          description: Unauthorized

  /dealerships/{dealershipId}/audiences/{id}:
    get:
      operationId: get_audience
      summary: Get audience
      description: |
        Retrieve a single audience by ID.

        **MCP Tool Name:** `get_audience`
      tags:
        - audiences
      parameters:
        - name: dealershipId
          in: path
          required: true
          schema:
            type: integer
          description: Dealership identifier
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Audience identifier
      responses:
        '200':
          description: Audience details
          content:
            application/json:
              example:
                id: 101
                name: "High Value Customers"
                description: "Customers with lifetime value > $10,000"
                shopper_count: 245
                filters:
                  lifetime_value_min: 10000
                created_at: "2024-01-01T00:00:00Z"
                updated_at: "2024-01-10T12:00:00Z"
        '404':
          description: Audience not found
        '401':
          description: Unauthorized

