          description: Dealership identifier
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Audience identifier
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number (1-based)
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: Number of items per page
      responses:
        '200':
          description: A paginated list of shoppers in the audience
          content:
            application/json:
              example:
                data:
                  - id: 12345
                    first_name: "John"
                    last_name: "Doe"
                    email: "john.doe@example.com"
                  - id: 12346
                    first_name: "Jane"
                    last_name: "Smith"
                    email: "jane.smith@example.com"
                meta:
                  current_page: 1
                  per_page: 10
                  total: 245
                  total_pages: 25
        '404':
          description: Audience not found
        '401':
          description: Unauthorized

  /dealerships/{dealershipId}/tasks:
    get:
      operationId: list_tasks
      summary: List tasks
      description: |
