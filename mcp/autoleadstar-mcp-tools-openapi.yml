                    shopper_id: 12345
                  - id: 5002
                    title: "Send quote"
                    description: "Email trade-in quote"
                    status: "completed"
                    due_date: "2024-01-18T14:00:00Z"
                    assigned_to: "agent_456"
                    shopper_id: 12346
