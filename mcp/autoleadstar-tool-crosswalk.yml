purpose: >-
  Make the MCP tool the first-class discovery unit and bind it to the REST operation
  it wraps. Fullpath is the rare case where the MCP surface and the REST surface were
  authored together and published side by side from the same docs site — the crosswalk
  is near-total rather than divergent, which is itself the finding.

