findings:
- >-
  100% of the MCP tools bind to a published REST operation. There is no tool an agent can call
  that a human cannot read the contract for — a materially better posture than the catalog norm,
  where MCP tool lists routinely exceed or diverge from the REST spec.
- >-
  81% of the REST operations have a tool. The three that do not are all shopper sub-resources,
  and the important one is listShopperEvents: the behavioral event stream that makes this a CDP
  rather than a contact list is absent from the agent surface.
- >-
  Twelve of thirteen tools are read-only. The one write is store_consents — an agent's only way
  to change state is to record communication consent, which is also the highest-liability write
  in this domain (TCPA/CCPA). Worth noting that the manifest exposes it with no confirmation
  semantics, no idempotency key, and a 500-record batch ceiling.
