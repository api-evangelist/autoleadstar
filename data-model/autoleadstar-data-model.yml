- name: Lead
  schema: Lead
  key: id (integer)
  operations: [listLeads]
  note: >-
    The widest schema in the API (~60 flat fields). Denormalized: it carries the person
    (name, emails, phones, address), the vehicle of interest (voi_* including voi_vin),
    the trade-in (trade_in_*), the sold vehicle (sold_vehicle_* including VIN and price)
    and the deal economics (front_gross, back_gross, total_gross) all on one object,
    with no $ref to a Vehicle schema.

- name: ADFLead
  schema: ADFLead
  note: ADF/XML-format lead, embedded on Shopper via ?embed=adf_leads.

- name: Appointment
  schema: Appointment
  key: id (integer)
  operations: [listAppointments]

- name: Vehicle
  schema: Vehicle
  note: >-
    A Vehicle schema exists in components but is reachable only through LatestSale /
    LatestLead embeds. The Lead schema does not use it.

- name: CmDealer
  schema: CmDealer
  key: client_key (string, ^40NM-\d+-1$)
  operations: [listDealers]
  note: >-
    The Consent Management surface's own dealer entity. It does NOT share an identifier
    with the Platform surface's integer dealershipId — the two surfaces cannot be joined
    from the published contracts alone.

- name: CmConsentContact
