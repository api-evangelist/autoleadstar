- name: ShopperEvent
  schema: ShopperEvent
  operations: [listShopperEvents]
  polymorphic: oneOf
  variants:
  - PageViewEvent
  - LeadEvent
  - SaleEvent
  - ConversionEvent
  - InputTrackingEvent
  - AdClickEvent
  - EnrichmentEvent
  - LeadHandlingSMSSentEvent
  - EmailClickEvent
