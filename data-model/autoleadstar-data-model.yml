summary: >-
  Entity-relationship graph derived from the $ref graph and the id-reference fields in the
  published OpenAPI (55 component schemas, 16 operations). Every relationship below is
  backed by a real `$ref` or a real `*_id` property in the spec — none are inferred from
  product marketing.

root: Dealership
identifier_style: integer surrogate ids (no prefixed/typed ids), except Consent Management
  which uses a string client_key matching ^40NM-\d+-1$.

entities:
- name: Dealership
  schema: null
  note: >-
    The tenancy root. It has NO schema of its own — it exists only as the required
    `dealershipId` path parameter on all thirteen Platform operations. There is no
    GET /dealerships and no way to discover which dealership ids a token can reach.
  operations: []

- name: Shopper
  schema: Shopper
  key: id (integer)
  operations: [listShoppers, getShopperById]
  note: >-
    The central entity — the unified customer profile that makes this a CDP. Carries
    scoring fields (score, marketing_engagement_score, loyalty_score,
    financial_durability_index, aim_propensity_score), customer_lifetime_value, location,
    household_flag and is_enriched. Ten fields are documented "single shopper only" and
    never appear in list responses.

- name: PrimaryContact
  schema: PrimaryContact
  note: Embedded on Shopper via ?embed=primary_contact.
- name: ContactDetail
  schema: ContactDetail
  note: All contacts for a shopper; single-shopper responses only.
- name: Location
