- name: Audience
  schema: Audience
  key: id (integer)
  operations: [listAudiences, getAudienceById, listAudienceShoppers, listShopperAudiences]
  note: >-
    A saved segment. `shopper_set` is a base64-encoded JSON filter definition — the segment
    logic is opaque to a client unless it decodes and interprets an undocumented format.
    `public_url` is documented as containing authentication, i.e. a capability URL.

- name: Task
  schema: Task
  key: id (integer)
