  - EmailSentEvent
  - SMSClickEvent
  - SMSRepliedEvent
  - SMSSentEvent
  - AppointmentEvent
  - ServiceLeadEvent
  - ServiceROEvent
  - ServiceAppointmentEvent
  note: >-
    Twenty behavioral event types under one oneOf — the richest object in the API and the
