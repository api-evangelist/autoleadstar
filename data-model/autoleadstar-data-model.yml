observations:
- Lead has no belongs_to Shopper. The Shopper carries latest_lead / latest_lead_date, but
  the Lead object itself exposes no shopper_id — the join is one-directional.
- Appointment relates to Lead, not to Shopper; Task and Activity relate to Shopper, not to
  Lead. There is no single traversal from a shopper to their appointments.
- Vehicle exists as a schema but the widest vehicle data (on Lead) is flat strings, so VIN
  and vehicle identity are not modeled consistently.
- The Consent Management entity graph is disjoint from the Platform entity graph — different
  key space (client_key vs dealershipId), different error envelope, different server.
