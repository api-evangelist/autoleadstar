summary: >-
  AutoLeadStar / Fullpath publishes NO pricing page and NO plan tiers. The company is sold
  entirely through a demo request and a dealership contract; neither the product site nor the
  developer portal names a price, a tier, an included quota or an overage rate. API access is
  not separately priced or self-serve — it is a capability of an existing dealership or
  vendor relationship.

