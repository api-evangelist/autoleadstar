- aid: autoleadstar:fullpath-mcp-tools
  name: Fullpath MCP Tools
  description: 'A first-party Model Context Protocol tool manifest published by Fullpath
    for AI assistants. Thirteen tools with real JSON Schema inputSchemas covering
    consent management, shoppers, audiences, tasks, leads, appointments and activities.
    Distributed as a downloadable mcp-tools.json for local MCP clients rather than
    as a hosted remote MCP endpoint.'
