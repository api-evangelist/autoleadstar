- aid: autoleadstar:fullpath-consent-management
  name: Fullpath Consent Management Vendor API
  description: 'The vendor-facing Consent Management API. Lists the dealers that have
    a consent-management integration with the authenticated vendor, reads the current
    communication-consent status for a single contact (email, phone_sms or phone_call)
    at a target dealer, and stores consent records in bulk for up to 500 contacts
    per call. Authenticated with a vendor API key issued at consent-management provisioning.'
  humanURL: https://developers.fullpath.com/consent.html
  baseURL: https://fullpath.com/api/v2/external/consent-management
  tags:
