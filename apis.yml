apis:
- aid: autoleadstar:fullpath-api
  name: Fullpath API v1
  description: 'The Fullpath Platform API. Read dealership shopper profiles and their
    associated emails, phones, events and audience memberships; list audiences and
    their members; and list tasks, leads, appointments and activities for a dealership.
    Also carries the vendor Consent Management API for listing integrated dealers
    and reading/writing communication consent per contact channel. Bearer-token authenticated,
    page/per_page paginated, sortable, rate limited at 100 requests per minute per
    API key.'
  humanURL: https://developers.fullpath.com/
  baseURL: https://api.fullpath.com/v1
