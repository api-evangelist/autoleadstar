aid: autoleadstar
name: AutoLeadStar
description: 'AutoLeadStar is an automotive marketing technology company founded in
  2015 in Jerusalem, Israel, that rebranded as Fullpath in March 2023 after raising
  a $40M Series C. It builds an enhanced Customer Data Platform (CDP) and AI ecosystem
  for franchise car dealerships, unifying first-party data from the dealership CRM,
  DMS, website, inventory feed and advertising accounts into a single shopper profile,
  then activating it through digital advertising, VIN-specific campaigns, equity mining,
  email/SMS audience activation, website personalization and an AI chat agent. The
  company opened a public API for the platform in November 2022 and today publishes
  a Scalar-rendered OpenAPI 3.0 reference at developers.fullpath.com covering shoppers,
  audiences, leads, tasks, appointments, activities and a vendor Consent Management
  API, alongside a downloadable Model Context Protocol tool manifest. Fullpath reports
  more than 2,000 dealership clients across North America and 200+ pre-built integrations,
  and was acquired by Cox Automotive.'
