paths:
  /dealers:
    get:
      security:
        - Bearer: []
      tags:
        - consents
      summary: List integrated dealers
      description: |
        Returns all dealers that have a consent-management integration with the
        authenticated vendor (both current and previous integrations).
      operationId: listDealers
      responses:
        '200':
          description: Dealer list for the authenticated vendor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CmDealersResponse'
              examples:
                vendor:
                  summary: Vendor with multiple dealers
                  value:
                    dealers:
                      - client_key: 40NM-00001-1
                        name: Example Motors
                        status: connected
                        connected_at: '2026-03-15T14:22:00+00:00'
                      - client_key: 40NM-00002-1
                        name: Downtown Auto
                        status: pending
                        connected_at: null
        '401':
          $ref: '#/components/responses/CmUnauthorized'
        '429':
          $ref: '#/components/responses/CmTooManyRequests'

  /{contact_type}/consent:
    get:
      security:
        - Bearer: []
      tags:
        - consents
      summary: Get consent for a contact
      description: |
        Returns the current consent status for a single contact at the target dealer.

        When no consent record exists, the response is `200` with `opt_in` and
        `consent_timestamp` set to `null` (not `404`).

        Requires `client_key` to identify the target dealer.
      operationId: getConsent
      parameters:
        - $ref: '#/components/parameters/CmContactType'
        - $ref: '#/components/parameters/CmContactValue'
        - $ref: '#/components/parameters/CmClientKey'
      responses:
        '200':
          description: Consent status for the contact (including when no record exists).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CmConsentResponse'
              examples:
                optedIn:
                  summary: Contact has opted in
                  value:
                    contact_value: user@example.com
                    opt_in: true
                    consent_timestamp: '2026-05-12T18:30:00+00:00'
                noRecord:
                  summary: No consent record on file
                  value:
                    contact_value: user@example.com
                    opt_in: null
                    consent_timestamp: null
        '400':
          $ref: '#/components/responses/CmBadRequest'
        '401':
          $ref: '#/components/responses/CmUnauthorized'
        '422':
          $ref: '#/components/responses/CmValidationError'
        '429':
          $ref: '#/components/responses/CmTooManyRequests'

  /{contact_type}/consents:
    post:
      security:
        - Bearer: []
      tags:
        - consents
      summary: Store consents in bulk
      description: |
        Stores one or more consent records for contacts at the target dealer.
        Accepts between 1 and 500 contacts per request.

        Exact duplicates in the same request (same normalized contact value and
        `consent_timestamp`) are deduplicated; the last entry wins.

        Requires `client_key` (query string) to identify the target dealer.

        On success, returns an empty JSON object and updates the vendor
        data-received timestamp for the dealer.
      operationId: storeConsents
      parameters:
        - $ref: '#/components/parameters/CmContactType'
        - $ref: '#/components/parameters/CmClientKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CmStoreConsentsRequest'
            examples:
              emailOptIn:
                summary: Single email opt-in
                value:
                  contacts:
                    - contact_value: user@example.com
                      opt_in: true
                      consent_timestamp: '2026-05-12T18:30:00Z'
              phoneOptOut:
                summary: Phone call opt-out
                value:
                  contacts:
                    - contact_value: '+1 (555) 123-4567'
                      opt_in: false
                      consent_timestamp: '2026-05-12T18:30:00Z'
      responses:
        '200':
          description: Consents stored successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CmEmptySuccessResponse'
        '400':
          description: |
            Business-rule or normalization failure.

            Common causes:
            - One or more contacts failed validation after normalization
              (`"One or more contacts are invalid."`)
            - `client_key` missing, invalid, or not integrated with the vendor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CmMessageResponse'
              examples:
                invalidContacts:
                  value:
                    message: One or more contacts are invalid.
                clientKeyRequired:
                  value:
                    message: client_key is required.
                dealerNotIntegrated:
                  value:
                    message: The requested dealer is not integrated with this vendor.
        '401':
          $ref: '#/components/responses/CmUnauthorized'
        '422':
          $ref: '#/components/responses/CmValidationError'
        '429':
          $ref: '#/components/responses/CmTooManyRequests'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CmMessageResponse'
              examples:
                storeFailed:
                  value:
                    message: Failed to store consents.
                vendorStatusFailed:
                  value:
                    message: Consents were stored but vendor integration status could not be updated.

  /dealerships/{dealershipId}/shoppers:
    get:
      security:
        - Bearer: []
      tags:
        - shoppers
      summary: List shoppers
      description: |
        Returns a paginated list of shoppers. Supports exact matching via the `q` query parameter for email or phone.
        
        Additional fields can be included in the response using the `embed` parameter. Available embed options:
        - `primary_contact` - Primary contact information (first_name, last_name, email, phone numbers, address)
        - `latest_lead_date` - Date of the latest lead (YYYY-MM-DD)
        - `latest_sale_date` - Date of the latest sale (YYYY-MM-DD)
        - `latest_sale` - Latest sale information
        - `latest_lead` - Latest lead information including vehicle details
        - `adf_leads` - Array of ADF leads
        - `latest_marketing_touchpoint_date` - Date of the latest marketing touchpoint (YYYY-MM-DD)
        - `marketing_engagement_score` - Marketing engagement score
        - `loyalty_score` - Loyalty score
        
        Multiple embed options can be specified as a comma-separated list, e.g., `embed=primary_contact,latest_lead_date,latest_lead`.
      operationId: listShoppers
      parameters:
        - $ref: '#/components/parameters/DealershipId'
        - in: query
          name: q
          description: Exact match query for email address or phone number (E.164 format)
          schema:
            type: string
          required: false
        - in: query
          name: embed
          description: |
            Comma-separated list of fields to embed in the response. Available options:
            primary_contact, latest_lead_date, latest_sale_date, latest_sale, latest_lead, adf_leads, latest_marketing_touchpoint_date, marketing_engagement_score, loyalty_score
          schema:
            type: string
          required: false
          example: "primary_contact,latest_lead_date"
        - in: query
          name: page
