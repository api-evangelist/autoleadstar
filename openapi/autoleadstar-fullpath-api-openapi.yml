        - in: query
          name: lead_id
          description: Filter by lead ID (integer)
          schema:
            type: integer
          required: false
        - in: query
          name: task_id
          description: Filter by task ID
          schema:
            type: integer
          required: false
        - in: query
          name: type
          description: Filter by activity type
          schema:
            type: string
            enum:
              - call
              - email
              - meeting
              - note
              - task
          required: false
        - in: query
          name: start_date
          description: Filter activities from this date (YYYY-MM-DD)
          schema:
            type: string
            format: date
          required: false
        - in: query
          name: end_date
          description: Filter activities until this date (YYYY-MM-DD)
          schema:
            type: string
            format: date
          required: false
        - in: query
          name: embed
          description: |
            Comma-separated list of fields to embed in the response. Available options:
            shopper
          schema:
            type: string
          required: false
          example: "shopper"
        - in: query
          name: page
          description: Page number (1-based)
          schema:
            type: integer
            minimum: 1
            default: 1
          required: false
        - in: query
          name: per_page
          description: Number of items per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          required: false
        - in: query
          name: sort
          description: Sort order (comma-separated field names with optional - prefix for descending)
          schema:
            type: string
          required: false
      responses:
        '200':
          description: A paginated list of activities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivitiesResponse'
        '204':
          description: No activities found
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
