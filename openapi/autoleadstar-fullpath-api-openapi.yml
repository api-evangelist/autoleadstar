openapi: 3.0.0
info:
  version: 1.0.0
  title: Fullpath API v1 - OpenAPI 3.0
  description: |
    # Fullpath API Introduction

    Welcome to the Fullpath API. This service allows you to:

    - Manage communication consent via the **Consent Management** vendor API
    - Retrieve shopper information and associated data
    - Access audience, task, lead, appointment, and activity data

    **Consent Management** endpoints (`/dealers`, `/{contact_type}/consent`,
    `/{contact_type}/consents`) default to
    `https://fullpath.com/api/v2/external/consent-management`. For Platform `/v1`
    endpoints, switch the Server dropdown to `https://api.fullpath.com/v1`.
    A dedicated Consent view is also at [Consent Management](./consent.html).

    All endpoints require authentication using a Bearer token.

    ---

    ## Authentication

    All API requests must include an `Authorization` header with a Bearer token.

    ```http
    Authorization: Bearer YOUR_TOKEN_HERE
    ```

    For Consent Management, use the vendor API key from consent-management provisioning.
    In Scalar, paste **only the raw API key** into the Bearer Token field (do not
    include the `Bearer ` prefix — Scalar adds it).

    If the token is missing or invalid, the API returns `401 Unauthorized` with a JSON error response:

    ```json
    {
      "error": "401",
      "message": "Unauthorized",
      "details": "Authentication token missing or invalid"
    }
    ```

    ---

    ## Error Responses

    Errors follow a consistent shape:

    ```json
    {
      "error": "<statusCode>",
      "message": "<summary>",
      "details": "<additional context>"
    }
    ```

    Common status codes:

    - 204: No Content (no records found for request)
    - 400: Bad Request (malformed input, invalid parameters)
    - 401: Unauthorized (missing/invalid token)
    - 404: Not Found (no matching resource)
    - 422: Validation exception (failed schema validation)
    - 429: Too Many Requests (rate limit exceeded)

    ---

    ## Pagination

    List endpoints support pagination with the following query parameters:

    - `page` - Page number (1-based, default: 1)
    - `per_page` - Number of items per page (default: 10, max: 100)

    All paginated responses include pagination metadata and have default sorting applied.

    ---

    ## Sorting

    Sorting is supported via the `sort` query parameter using comma-separated field names with optional direction prefix:

    - `sort=name` - Sort by name ascending
    - `sort=-created_at` - Sort by created_at descending
    - `sort=name,-created_at` - Sort by name ascending, then created_at descending

  termsOfService: https://www.fullpath.com/legal-and-trust/
  contact:
    name: API Support
    email: support@fullpath.com
servers:
  - url: https://fullpath.com/api/v2/external/consent-management
    description: Production (fullpath.com)
  - url: https://api.fullpath.com/v1
    description: Production (api.fullpath.com)
  - url: https://staging-api.fullpath.com/v1
    description: Staging (api.fullpath.com)
tags:
  - name: consents
    x-displayName: Consent Management
    description: |
      Vendor Consent Management API for listing integrated dealers and reading/writing
      communication consent. Defaults to
      `https://fullpath.com/api/v2/external/consent-management`.
  - name: shoppers
    description: Operations related to shoppers
  - name: audiences
    description: Operations related to audiences
  - name: tasks
    description: Operations related to tasks
  - name: leads
    description: Operations related to leads
  - name: appointments
    description: Operations related to appointments
  - name: activities
    description: Operations related to activities
components:
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Platform JWT or Consent Management vendor API key.
        In Scalar, paste only the raw token/key (no `Bearer ` prefix).
  parameters:
    DealershipId:
      in: path
      name: dealershipId
      required: true
      description: Dealership identifier (integer)
      schema:
        type: integer
    CmContactType:
      in: path
      name: contact_type
      required: true
      description: Channel the consent applies to.
      schema:
        $ref: '#/components/schemas/CmContactType'
    CmContactValue:
      in: query
      name: contact_value
      required: true
      description: |
        Raw contact identifier to look up. Emails are lowercased; phone numbers are
        standardized before lookup. The normalized value is echoed in the response.
      schema:
        type: string
      examples:
        email:
          value: user@example.com
        phone:
          value: '+1 (555) 123-4567'
    CmClientKey:
      in: query
      name: client_key
      required: true
      description: |
        Fullpath client key for the target dealer (format `40NM-{number}-1`).
        Required on all consent endpoints.
      schema:
        type: string
        pattern: '^40NM-\d+-1$'
      example: 40NM-00001-1
  responses:
    CmUnauthorized:
      description: Missing, invalid, or expired Bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CmMessageResponse'
          example:
            message: Unauthorized
    CmBadRequest:
      description: Request failed business-rule validation outside Laravel form validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CmMessageResponse'
    CmValidationError:
      description: "Laravel validation failure (422 Unprocessable Entity)."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CmValidationErrorResponse'
          example:
            message: The contact value field is required.
            errors:
              contact_value:
                - The contact value field is required.
    CmTooManyRequests:
      description: Rate limit exceeded (100 requests per minute per API key).
      headers:
        Retry-After:
          description: Seconds until the rate limit resets.
          schema:
            type: integer
        X-RateLimit-Limit:
          schema:
            type: integer
        X-RateLimit-Remaining:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CmMessageResponse'
          example:
            message: Too Many Attempts.
  schemas:
    CmContactType:
      type: string
      enum:
        - email
        - phone_sms
        - phone_call
    CmIntegrationStatus:
      type: string
      description: Consent-management integration status for a dealer.
      enum:
        - connected
        - pending
    CmDealer:
      type: object
      required:
        - client_key
        - name
        - status
        - connected_at
      properties:
        client_key:
          type: string
          description: "Fullpath client key (40NM-{number}-1)."
          example: 40NM-00001-1
        name:
          type: string
          description: Dealer display name.
          example: Example Motors
        status:
          $ref: '#/components/schemas/CmIntegrationStatus'
        connected_at:
          type: string
          format: date-time
          nullable: true
          description: |
            ISO 8601 timestamp when the integration reached `connected` status.
            `null` when status is not `connected` or no connection date is recorded.
    CmDealersResponse:
      type: object
      required:
        - dealers
      properties:
        dealers:
          type: array
          items:
            $ref: '#/components/schemas/CmDealer'
    CmConsentResponse:
      type: object
      required:
        - contact_value
        - opt_in
        - consent_timestamp
      properties:
        contact_value:
          type: string
          description: Normalized contact value used for the lookup.
          example: user@example.com
        opt_in:
          type: boolean
          nullable: true
          description: |
            `true` if opted in, `false` if opted out, `null` when no consent record
            exists for this contact.
        consent_timestamp:
          type: string
          format: date-time
          nullable: true
          description: |
            ISO 8601 timestamp of the consent event. `null` when no consent record
            exists.
    CmConsentContact:
      type: object
      required:
        - contact_value
        - opt_in
        - consent_timestamp
      properties:
        contact_value:
          type: string
          description: |
            Raw contact identifier. Must be a valid email for `email`, or a valid
            phone number for `phone_sms` / `phone_call`.
        opt_in:
          type: boolean
          description: "true to record opt-in; false to record opt-out."
        consent_timestamp:
          type: string
          format: date-time
          description: When the consent event occurred (ISO 8601).
    CmStoreConsentsRequest:
      type: object
      required:
        - contacts
      properties:
        contacts:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/CmConsentContact'
    CmEmptySuccessResponse:
      type: object
      description: Empty JSON object returned on successful bulk store.
      additionalProperties: false
      example: {}
    CmMessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    CmValidationErrorResponse:
      type: object
      required:
        - message
        - errors
      properties:
        message:
          type: string
          description: Summary of the validation failure.
        errors:
          type: object
          description: Field-level validation errors keyed by input name.
          additionalProperties:
            type: array
            items:
              type: string
    Shopper:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          description: Unique shopper identifier
          example: 16395039
        primary_contact:
          $ref: '#/components/schemas/PrimaryContact'
        latest_lead_date:
          type: string
          format: date
          nullable: true
          description: Date of the latest lead (YYYY-MM-DD)
          example: "2024-01-15"
        latest_sale_date:
          type: string
          format: date
          nullable: true
          description: Date of the latest sale (YYYY-MM-DD)
          example: null
        latest_marketing_touchpoint_date:
          type: string
          format: date
          nullable: true
          description: Date of the latest marketing touchpoint (YYYY-MM-DD)
          example: "2024-01-15"
        latest_sale:
          $ref: '#/components/schemas/LatestSale'
        latest_lead:
          $ref: '#/components/schemas/LatestLead'
        adf_leads:
          type: array
          items:
            $ref: '#/components/schemas/ADFLead'
          description: Array of ADF leads
          example: []
        marketing_engagement_score:
          type: string
          nullable: true
          description: Marketing engagement score
          example: "10"
        loyalty_score:
          type: string
          nullable: true
          description: Loyalty score
          example: "0"
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/ContactDetail'
          description: Array of all contacts associated with the shopper (single shopper only)
        location:
          $ref: '#/components/schemas/Location'
        score:
          type: integer
          nullable: true
          description: Shopper score (single shopper only)
          example: 10
        public_link:
          type: string
          format: uri
          nullable: true
          description: Public link for the shopper (single shopper only)
          example: "https://example.com/s/abc123xyz"
        customer_lifetime_value:
          $ref: '#/components/schemas/CustomerLifetimeValue'
        latest_sale_estimated_equity:
          type: number
          nullable: true
          description: Estimated equity from latest sale (single shopper only)
          example: null
        household_flag:
          type: boolean
          nullable: true
          description: Whether this is a household shopper (single shopper only)
          example: false
        customer_tags:
          type: array
          items:
            type: string
          description: Array of customer tags (single shopper only)
          example: []
        is_enriched:
          type: boolean
          nullable: true
          description: Whether the shopper data has been enriched (single shopper only)
          example: true
        salesperson:
          type: string
          nullable: true
          description: Assigned salesperson (single shopper only)
          example: "Jane Smith"
        group_shopper_id:
          type: string
          nullable: true
          description: Group shopper identifier (single shopper only)
          example: "GRP123456789"
        financial_durability_index:
          type: number
          nullable: true
          description: Financial durability index (single shopper only)
          example: 8.46
        aim_propensity_score:
          type: number
          nullable: true
          description: AIM propensity score (single shopper only)
          example: 2.54
      description: Represents a shopper. Additional fields are available via the embed parameter. Some fields (contacts, location, score, public_link, customer_lifetime_value, latest_sale_estimated_equity, household_flag, customer_tags, is_enriched, salesperson, group_shopper_id, financial_durability_index, aim_propensity_score) are only available when getting a single shopper.
    PrimaryContact:
      type: object
      nullable: true
      properties:
        source:
          type: string
          nullable: true
          description: Source of the contact (e.g., customer, crm_customer)
          example: "customer"
        first_name:
          type: string
          nullable: true
          description: First name
          example: "John"
        middle_name:
          type: string
          nullable: true
          description: Middle name
          example: null
        last_name:
          type: string
          nullable: true
          description: Last name
          example: "Doe"
        full_name:
          type: string
          nullable: true
          description: Full name
          example: "John Doe"
        main_email_addresses:
          type: string
          format: email
          nullable: true
          description: Main email address
          example: "john.doe@example.com"
        alternative_email_addresses:
          type: string
          nullable: true
          description: Alternative email addresses
          example: null
        cell_phone:
          type: string
          nullable: true
          description: Cell phone number
          example: "+15555551234"
        home_phone:
          type: string
          nullable: true
          description: Home phone number
          example: "+15555551235"
        work_phone:
          type: string
          nullable: true
          description: Work phone number
          example: null
        address:
          type: string
          nullable: true
          description: Street address
          example: null
        city:
          type: string
          nullable: true
          description: City
          example: "Anytown"
        state:
          type: string
          nullable: true
          description: State
          example: "NY"
        zipcode:
          type: string
          nullable: true
          description: ZIP code
          example: "12345"
        timestamp:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the contact was created/updated
          example: "2024-01-15T10:30:00Z"
        latitude:
          type: number
          nullable: true
          description: Latitude coordinate
          example: null
        longitude:
          type: number
          nullable: true
          description: Longitude coordinate
          example: null
        status:
          type: string
          nullable: true
          description: Contact status
          example: null
        crm_link:
          type: string
          format: uri
          nullable: true
          description: Link to CRM customer dashboard
          example: null
        creation_date:
          type: string
          format: date
          nullable: true
          description: Creation date (YYYY-MM-DD)
          example: null
        external_customer_id:
          type: string
          nullable: true
          description: External customer identifier
          example: null
        customer_type:
          type: string
          nullable: true
          description: Customer type
          example: null
        email:
          type: string
          format: email
          nullable: true
          description: Email address (legacy field, use main_email_addresses)
          example: "john.doe@example.com"
        full_address:
          type: string
          nullable: true
          description: Full address (legacy field, use city, state, zipcode)
          example: "Anytown, NY, 12345"
      description: Primary contact information for a shopper. Extended version available in single shopper responses.
    LatestLead:
      type: object
      nullable: true
      properties:
        id:
          type: string
          description: Lead identifier
          example: "1234567890"
        salesperson:
          type: string
          nullable: true
          description: Name of the salesperson
          example: "Jane Smith"
        date:
          type: string
          format: date
          description: Lead date (YYYY-MM-DD)
          example: "2024-01-15"
        up_type:
          type: string
          nullable: true
          description: UP type
          example: "Internet"
        source:
          type: string
          nullable: true
          description: Lead source
          example: "Website - Contact Form"
        status:
          type: string
          nullable: true
          description: Lead status
          example: "Bad"
        sub_status:
          type: string
          nullable: true
          description: Lead sub-status
          example: "Duplicate lead"
        vehicle:
          $ref: '#/components/schemas/Vehicle'
      description: Latest lead information for a shopper
    LatestSale:
      type: object
      nullable: true
      description: Latest sale information for a shopper. Structure similar to LatestLead.
    Vehicle:
      type: object
      nullable: true
      properties:
        vin:
          type: string
          nullable: true
          description: Vehicle Identification Number
          example: "1HGBH41JXMN109186"
        condition:
          type: string
          nullable: true
          description: Vehicle condition (e.g., new, used)
          example: "new"
        year:
          type: string
          nullable: true
          description: Vehicle year
          example: "2024"
        make:
          type: string
          nullable: true
          description: Vehicle make
          example: "Toyota"
        model:
          type: string
          nullable: true
          description: Vehicle model
          example: "Camry"
        trim:
          type: string
          nullable: true
          description: Vehicle trim
          example: "LE"
      description: Vehicle information
    ADFLead:
      type: object
      nullable: true
      description: ADF lead information
    ContactDetail:
      type: object
      nullable: true
      properties:
        source:
          type: string
          nullable: true
          description: Source of the contact (e.g., crm_customer, website_conversion)
          example: "crm_customer"
        first_name:
          type: string
          nullable: true
          description: First name
          example: "John"
        middle_name:
          type: string
          nullable: true
          description: Middle name
          example: null
        last_name:
          type: string
          nullable: true
          description: Last name
          example: "Doe"
        full_name:
          type: string
          nullable: true
          description: Full name
          example: "John Doe"
        main_email_addresses:
          type: string
          format: email
          nullable: true
          description: Main email address
          example: "john.doe@example.com"
        alternative_email_addresses:
          type: string
          nullable: true
          description: Alternative email addresses
          example: null
        cell_phone:
          type: string
          nullable: true
          description: Cell phone number
          example: "+15555551234"
        home_phone:
          type: string
          nullable: true
          description: Home phone number
          example: "+15555551235"
        work_phone:
          type: string
          nullable: true
          description: Work phone number
          example: null
        address:
          type: string
          nullable: true
          description: Street address
          example: null
        city:
          type: string
          nullable: true
          description: City
          example: "Anytown"
        state:
          type: string
          nullable: true
          description: State
          example: "NY"
        zipcode:
          type: string
          nullable: true
          description: ZIP code
          example: "12345"
        timestamp:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the contact was created/updated
          example: "2024-01-15T10:30:00Z"
        latitude:
          type: number
          nullable: true
          description: Latitude coordinate
          example: null
        longitude:
          type: number
          nullable: true
          description: Longitude coordinate
          example: null
        status:
          type: string
          nullable: true
          description: Contact status
          example: "Active"
        crm_link:
          type: string
          format: uri
          nullable: true
          description: Link to CRM customer dashboard
          example: "https://example.com/crm/customer/123456"
        creation_date:
          type: string
          format: date
          nullable: true
          description: Creation date (YYYY-MM-DD)
          example: "2024-01-15"
        external_customer_id:
          type: string
          nullable: true
          description: External customer identifier
          example: "EXT123456"
        customer_type:
          type: string
          nullable: true
          description: Customer type
          example: null
      description: Contact information for a shopper
    Location:
      type: object
      nullable: true
      properties:
        title:
          type: string
          nullable: true
          description: Full location title
          example: "Anytown, NY, 12345"
        city:
          type: string
          nullable: true
          description: City
          example: "Anytown"
        state:
          type: string
          nullable: true
          description: State
          example: "NY"
        zipcode:
          type: string
          nullable: true
          description: ZIP code
          example: "12345"
        source:
          type: string
          nullable: true
          description: Source of the location data
          example: "customer"
        address:
          type: string
          nullable: true
          description: Street address
          example: null
        distance_from_dealership:
          type: number
          nullable: true
          description: Distance from dealership (in miles or kilometers)
          example: null
      description: Location information for a shopper
    SalesServices:
      type: object
      properties:
        count:
          type: integer
          description: Number of sales/services
          example: 0
        total:
          type: number
          description: Total value
          example: 0
        gross:
          type: number
          description: Gross value
          example: 0
      description: Sales or services summary
    CustomerLifetimeValue:
      type: object
      nullable: true
      properties:
        sales:
          $ref: '#/components/schemas/SalesServices'
        services:
          $ref: '#/components/schemas/SalesServices'
        total_lifetime_value:
          type: number
          description: Total lifetime value
          example: 0
      description: Customer lifetime value information
    ShopperEmail:
      type: object
      required:
        - id
        - email
        - created_at
      properties:
        id:
          type: integer
          description: Unique identifier for the email record
        email:
          type: string
          format: email
          description: Email address
        is_primary:
          type: boolean
          description: Whether this is the primary email address
        is_emailable:
          type: boolean
          description: Whether this email can be used for sending
        created_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the email was added
      description: Represents an email address associated with a shopper
    ShopperPhone:
      type: object
      required:
        - id
        - phone
        - created_at
      properties:
        id:
          type: integer
          description: Unique identifier for the phone record
        phone:
          type: string
          pattern: '^\+[1-9]\d{1,14}$'
          description: Phone number in E.164 format
        is_primary:
          type: boolean
          description: Whether this is the primary phone number
        is_textable:
          type: boolean
          description: Whether this phone can be used for sending text messages
        created_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the phone was added
      description: Represents a phone number associated with a shopper
    ShopperEvent:
      oneOf:
        - $ref: '#/components/schemas/PageViewEvent'
        - $ref: '#/components/schemas/LeadEvent'
        - $ref: '#/components/schemas/SaleEvent'
        - $ref: '#/components/schemas/ConversionEvent'
        - $ref: '#/components/schemas/InputTrackingEvent'
        - $ref: '#/components/schemas/AdClickEvent'
        - $ref: '#/components/schemas/EnrichmentEvent'
        - $ref: '#/components/schemas/LeadHandlingSMSSentEvent'
        - $ref: '#/components/schemas/EmailClickEvent'
        - $ref: '#/components/schemas/EmailOpenEvent'
        - $ref: '#/components/schemas/EmailSentEvent'
        - $ref: '#/components/schemas/SMSClickEvent'
        - $ref: '#/components/schemas/SMSRepliedEvent'
        - $ref: '#/components/schemas/SMSSentEvent'
        - $ref: '#/components/schemas/AppointmentEvent'
        - $ref: '#/components/schemas/ServiceLeadEvent'
        - $ref: '#/components/schemas/ServiceROEvent'
        - $ref: '#/components/schemas/ServiceAppointmentEvent'
      discriminator:
        propertyName: type
        mapping:
          page_view: '#/components/schemas/PageViewEvent'
          lead: '#/components/schemas/LeadEvent'
          sale: '#/components/schemas/SaleEvent'
          conversion: '#/components/schemas/ConversionEvent'
          input_tracking: '#/components/schemas/InputTrackingEvent'
          ad_click: '#/components/schemas/AdClickEvent'
          enrichment: '#/components/schemas/EnrichmentEvent'
          lead_handling_sms_sent: '#/components/schemas/LeadHandlingSMSSentEvent'
          email_click: '#/components/schemas/EmailClickEvent'
          email_open: '#/components/schemas/EmailOpenEvent'
          email_sent: '#/components/schemas/EmailSentEvent'
          sms_click: '#/components/schemas/SMSClickEvent'
          sms_replied: '#/components/schemas/SMSRepliedEvent'
          sms_sent: '#/components/schemas/SMSSentEvent'
          appointment: '#/components/schemas/AppointmentEvent'
          service_lead: '#/components/schemas/ServiceLeadEvent'
          service_ro: '#/components/schemas/ServiceROEvent'
          service_appointment: '#/components/schemas/ServiceAppointmentEvent'
      description: Represents an event associated with a shopper. Events are returned ungrouped in a flat array.
    PageViewEvent:
      type: object
      required:
        - identifier
        - type
        - timestamp
      properties:
