    get:
      security:
        - Bearer: []
      tags:
        - tasks
      summary: List tasks
      description: |
        Returns a paginated list of tasks with optional filtering.
        
        By default, only non-deleted tasks (where `deleted_at` is null) are returned. Use the `trashed` parameter to include or filter deleted tasks.
        
        Additional fields can be included in the response using the `embed` parameter. Available embed options:
        - `activities` - Array of activities associated with the task
        - `notes` - Array of task notes
        - `shopper` - Shopper object associated with the task
        
        Multiple embed options can be specified as a comma-separated list, e.g., `embed=activities,notes,shopper`.
      operationId: listTasks
      parameters:
        - $ref: '#/components/parameters/DealershipId'
        - in: query
          name: assigned_to
          description: Filter by assigned user ID
          schema:
            type: integer
          required: false
        - in: query
          name: status
          description: Filter by task status
          schema:
            type: string
            enum:
              - pending
              - in_progress
              - completed
              - cancelled
          required: false
        - in: query
          name: priority
          description: Filter by task priority
          schema:
            type: string
            enum:
              - low
              - medium
              - high
          required: false
        - in: query
          name: due_date_from
          description: Filter tasks due from this date (YYYY-MM-DD)
          schema:
            type: string
            format: date
          required: false
        - in: query
          name: due_date_to
          description: Filter tasks due until this date (YYYY-MM-DD)
          schema:
            type: string
            format: date
          required: false
        - in: query
          name: trashed
          description: |
            Filter tasks by deletion status. By default (or with `trashed=without`), only non-deleted tasks are returned.
            - `without` - Return only non-deleted tasks (default behavior)
            - `with` - Return all tasks including deleted ones
            - `only` - Return only deleted tasks
          schema:
            type: string
            enum:
              - with
              - only
              - without
          required: false
        - in: query
          name: embed
          description: |
            Comma-separated list of fields to embed in the response. Available options:
            activities, notes, shopper
          schema:
            type: string
          required: false
          example: "activities,notes,shopper"
        - in: query
          name: page
          description: Page number (1-based)
          schema:
            type: integer
            minimum: 1
            default: 1
          required: false
        - in: query
          name: per_page
          description: Number of items per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          required: false
        - in: query
          name: sort
          description: Sort order (comma-separated field names with optional - prefix for descending)
          schema:
            type: string
          required: false
      responses:
        '200':
          description: A paginated list of tasks
          content:
            application/json:
              schema:
