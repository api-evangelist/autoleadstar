components:
  schemas:
    SalesServices:
      type: object
      properties:
        count:
          type: integer
          description: Number of sales/services
          example: 0
        total:
          type: number
          description: Total value
          example: 0
        gross:
          type: number
          description: Gross value
          example: 0
      description: Sales or services summary
    LeadHandlingSMSSentEvent:
      type: object
      required:
      - identifier
      - type
      - timestamp
      properties:
        identifier:
          type: string
          format: uuid
          description: Unique identifier for the event
          example: 123e4567-e89b-12d3-a456-426614174000
        type:
          type: string
          enum:
          - lead_handling_sms_sent
          example: lead_handling_sms_sent
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the event occurred
          example: '2024-01-15T10:30:00Z'
        product:
          type:
          - string
          - 'null'
          description: Product identifier
          example: lead_handling
        delivery:
          type:
          - string
          - 'null'
          description: Delivery identifier
          example: fakeDeliveryHash1234567890
        crm_customer:
          type:
          - string
          - 'null'
          description: CRM customer identifier
          example: '12345678'
        shopper_id:
          type:
          - string
          - 'null'
          description: Shopper identifier
          example: '12345678'
        recipient_name:
          type:
          - string
          - 'null'
          description: Recipient name
          example: John Doe
        recipient_email:
          type:
          - string
          - 'null'
          format: email
          description: Recipient email
          example: null
        recipient_phone_number:
          type:
          - string
          - 'null'
          description: Recipient phone number
          example: '5551234567'
        sms_thread:
          type:
          - integer
          - 'null'
          description: SMS thread identifier
          example: 1234567
        has_equity_content:
          type:
          - boolean
          - 'null'
          description: Has equity content
          example: null
        has_dynamic_payments_content:
          type:
          - boolean
          - 'null'
          description: Has dynamic payments content
          example: null
        incoming_replies_count:
          type:
          - integer
          - 'null'
          description: Incoming replies count
          example: 0
        lead_handling_delivery_category:
          type:
          - string
          - 'null'
          description: Lead handling delivery category
          example: needs_human
        delivery_text:
          type:
          - string
          - 'null'
          description: Delivery text
          example: null
      description: Lead handling SMS sent event
    EmailClickEvent:
      type: object
      required:
      - identifier
      - type
      - timestamp
      properties:
        identifier:
          type: string
          format: uuid
          description: Unique identifier for the event
          example: 123e4567-e89b-12d3-a456-426614174000
        type:
          type: string
          enum:
          - email_click
          example: email_click
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the event occurred
          example: '2024-01-15T10:30:00Z'
        product:
          type:
          - string
          - 'null'
          description: Product identifier
          example: nurture
        delivery:
          type:
          - string
          - 'null'
          description: Delivery identifier
          example: fakeDeliveryHash1234567890
        crm_customer:
          type:
          - string
          - 'null'
          description: CRM customer identifier
          example: '12345678'
        shopper_id:
          type:
          - string
          - 'null'
          description: Shopper identifier
          example: '12345678'
        recipient_name:
          type:
          - string
          - 'null'
