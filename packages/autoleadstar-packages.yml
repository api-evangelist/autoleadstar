registries_searched:
- registry: npm
  endpoint: https://registry.npmjs.org/-/v1/search
  queries:
  - fullpath
  - autoleadstar
  result: >-
    No first-party package. The npm package `fullpath` (v1.2.2, published 2016-07-24,
