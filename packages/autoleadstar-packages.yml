  first_party_hit: false

docs_evidence:
- url: https://developers.fullpath.com/
  http_status: 200
  finding: >-
    The developer portal is a single Scalar-rendered reference page whose only two outbound
    links are ./openapi.yaml and ./mcp.html. It names no SDK, no client library, no CLI and
    no code-generation guidance.
- url: https://www.fullpath.com/page-sitemap.xml
  http_status: 200
  finding: >-
    78 published pages; grep for sdk / developer / api / cli returns nothing. The only
    developer-adjacent pages are /integrations/ and /legal-and-trust/.
- url: https://www.fullpath.com/integrations/
  http_status: 200
  finding: >-
    The partner program page advertises "open APIs" and "Ready-to-Use Documentation" and
    points technology partners at developers.fullpath.com — but offers no library, no
    starter repo and no code sample beyond the Scalar console's generated curl.

analysis:
  consumption_path: >-
    Raw HTTP. A vendor integrating the Consent Management API or the Platform /v1 API writes
    its own client against the OpenAPI, or generates one from
    https://developers.fullpath.com/openapi.yaml.
  generation_ready: true
  generation_note: >-
    The published OpenAPI 3.0 is clean enough to generate a client from — every operation has
    an operationId, summary, description, tags and response examples — so the absence of an
    SDK is a distribution choice, not a spec-quality problem.
  agent_surface_substitute: >-
    The closest thing to a shipped client is the MCP tool manifest at
    developers.fullpath.com/mcp-tools.json (see mcp/autoleadstar-mcp.yml). It is a static
    JSON download, not a package: it has no registry entry, no version field and no release
    date, so a consumer cannot tell whether the copy they hold is current.
  decay_signal: >-
    None available. With no published package there is no release date to read, which means
    this pipeline has no provider-published, reliably-dated abandonment signal for Fullpath
    in either direction — neither evidence of active maintenance nor evidence of decay.

gaps:
- No first-party SDK in any language.
- No public GitHub organization, so no starter code, no issue tracker, no sample apps.
- The MCP manifest — the one client-side artifact Fullpath does distribute — is unversioned
  and undated, which is the same unpinned-distribution problem a CDN script tag has.

