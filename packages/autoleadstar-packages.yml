  result: No Fullpath crate.
  first_party_hit: false
- registry: GitHub
  endpoint: https://api.github.com/orgs/<org>
  queries:
  - fullpath
  - fullpath-ai
  - autoleadstar
  result: >-
    All three org names return 404 — the company operates no public GitHub organization.
