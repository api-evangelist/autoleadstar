method: searched
source: >-
  Registry searches against npm, PyPI, RubyGems, Packagist, crates.io and GitHub, plus a
  read of the provider's own developer portal (https://developers.fullpath.com/) and the
  78-page www.fullpath.com sitemap, on 2026-08-14.
docs: https://developers.fullpath.com/
summary: >-
  AutoLeadStar / Fullpath publishes NO first-party client libraries in any public package
  registry, and names none on its developer portal. Integration is raw HTTP against
  api.fullpath.com with a Bearer token, or the downloadable MCP tool manifest. This is an
  honest zero, established by search rather than assumed.

