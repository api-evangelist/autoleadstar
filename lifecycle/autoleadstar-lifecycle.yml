  founded_note: >-
    Founding year is reported inconsistently across sources (the predecessor 40Nuggets
    dates to ~2012; AutoLeadStar as a brand to the mid-2010s). Left null rather than
    asserted.
  headquarters: Jerusalem, Israel
  former_name: AutoLeadStar
  renamed: '2023-03'
  rename_source: https://www.fullpath.com/blog/autoleadstar-rebrands-to-fullpath/
  acquisition:
    acquirer: Cox Automotive
    source: https://www.prnewswire.com/news-releases/cox-automotive-to-acquire-fullpath-bringing-ai-native-data-and-marketing-infrastructure-to-the-industrys-largest-dealer-network-302750703.html
    note: >-
      An announced acquisition is itself a lifecycle risk for anyone integrating: the
      autoleadstar.com domain is already only in scope for the vulnerability-disclosure
      policy, and API hosts have migrated to fullpath.com.
  legacy_domains:
  - autoleadstar.com
  - 40nuggets.com
  note: >-
    The `40NM-` prefix on every Consent Management client_key (pattern ^40NM-\d+-1$) and
    the *.40nuggets.com entry in the vulnerability-disclosure scope are surviving artifacts
    of 40Nuggets, the company's predecessor name before AutoLeadStar. Three brand generations
    are visible in one live API contract.
