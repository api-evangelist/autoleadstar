status_page:
  present: false
  url: null
  probes:
  - url: https://status.fullpath.com/
    status: 200
    result: >-
      Resolves but 302s onto https://www.fullpath.com/ and serves the marketing homepage
      (title "Fullpath | AI Ecosystem for Auto Dealerships"). It is a parked/vanity subdomain,
      NOT a status page. Recorded as absent — a 200 that renders the homepage is not evidence.
  note: >-
    No Statuspage/Better Uptime/Instatus property was found on any Fullpath host. For a
    platform 2,000+ dealerships run their advertising through, this is the largest single
    operational-transparency gap.

